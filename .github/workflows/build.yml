name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CGO_ENABLED: "0"

jobs:
  check:
    name: Tests and checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-24.04, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install Chinese fonts for rendering tests
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-cjk
          fc-match ':lang=zh-cn'
      - name: Test
        run: go test ./... -skip '^TestLiveHome$'
      - name: Vet
        run: go vet ./...
      - name: Check MyGo UI lifetimes
        if: runner.os == 'macOS'
        run: go tool mygo vet .

  build:
    name: Package ${{ matrix.name }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: macos-latest
            platforms: darwin/universal
            artifact: knack-macos-universal
            path: dist/darwin-universal/*.dmg
          - name: Windows
            runner: ubuntu-24.04
            platforms: windows/amd64,windows/arm64
            artifact: knack-windows
            path: dist/windows-*/knack-setup-*.exe
          - name: Linux
            runner: ubuntu-24.04
            platforms: linux/amd64,linux/arm64
            artifact: knack-linux
            path: |
              dist/linux-*/*.tar.gz
              dist/linux-*/*.deb
              dist/linux-*/install.sh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install NSIS for Windows installers
        if: matrix.name == 'Windows'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y nsis
      - name: Build packages
        env:
          TARGET_PLATFORMS: ${{ matrix.platforms }}
        run: go tool mygo build -platform "$TARGET_PLATFORMS"
      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  release:
    name: Publish release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG_NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: knack-*
          path: packages
      - name: Verify version and collect release assets
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import pathlib
          import shutil

          version = json.loads(pathlib.Path("mygo.json").read_text())["version"]
          tag = os.environ["TAG_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match mygo.json version {version}")
          if not pathlib.Path(f".github/releases/{tag}.md").is_file():
              raise SystemExit(f"Missing release notes for {tag}")
          packages = pathlib.Path("packages")
          assets = pathlib.Path("release-assets")
          assets.mkdir()
          names = [f"knack-{version}.dmg", "install.sh"]
          for arch in ("amd64", "arm64"):
              names += [f"knack-setup-{version}-{arch}.exe",
                        f"knack-{version}-linux-{arch}.tar.gz",
                        f"knack_{version}_{arch}.deb"]
          for name in names:
              matches = sorted(packages.rglob(name))
              expected = 2 if name == "install.sh" else 1
              if len(matches) != expected or any(p.stat().st_size == 0 for p in matches):
                  raise SystemExit(f"Missing, empty or duplicate asset: {name}")
              if any(p.read_bytes() != matches[0].read_bytes() for p in matches[1:]):
                  raise SystemExit(f"Conflicting asset: {name}")
              shutil.copyfile(matches[0], assets / name)
          checksums = "".join(
              f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n"
              for p in sorted(assets.iterdir()))
          (assets / "SHA256SUMS").write_text(checksums)
          print(checksums)
          PY
      - name: Create draft with all assets, then publish
        run: |
          gh release create "$TAG_NAME" release-assets/* --verify-tag --draft \
            --title "Knack $TAG_NAME" --notes-file ".github/releases/$TAG_NAME.md"
          gh release edit "$TAG_NAME" --draft=false --latest
